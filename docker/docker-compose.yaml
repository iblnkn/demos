services:
  pai-demo:
    image: pai_demo:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    depends_on:
      zenoh-router:
        condition: service_started
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority
      # If rviz and gazebo windows don't open, run these commands:
      # export XAUTHORITY=$HOME/.Xauthority
      # chmod 755 $HOME/.Xauthority
      # xhost +si:localuser:root
    network_mode: host
    restart: "no"
    # CMD is passed to the ENTRYPOINT which activates the pixi env first
    command: ["ros2", "launch", "pai_bringup", "so_arm_gz_bringup.launch.py"]

  zenoh-router:
    image: pai_demo:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    network_mode: host
    restart: "no"
    command: ["ros2", "run", "rmw_zenoh_cpp", "rmw_zenohd"]
