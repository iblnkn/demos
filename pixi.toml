[workspace]
authors = ["Julia Jia <juliajster@gmail.com>"]
channels = ["conda-forge", "https://prefix.dev/robostack-kilted"]
name = "demos"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[environments]
dev = ["dev"]
ci = ["ci"]
# ml: standard PyTorch (most NVIDIA GPUs and CPU-only)
# ml-blackwell: cu130 wheels for RTX 5090 (Blackwell, sm_120)
ml = ["ml", "cuda-standard"]
ml-blackwell = ["ml", "cuda-blackwell"]

[feature.dev.tasks]
build = { cmd = ["colcon", "build", "--mixin", "debug", "--symlink-install"], inputs = ["src"] }

[feature.ci.activation.env]
CMAKE_INSTALL_MODE = "COPY"

[tasks]

# ---- Workspace setup (composed from hidden helpers below) ----

[tasks._vcs-import]
description = "Import external source repos into src/ from repos/external.repos"
default-environment = "default"
cmd = ["vcs", "import", "src", "--input", "repos/external.repos", "--recursive"]

[tasks._register-mixins]
description = "Register and update the colcon-mixin-repository default index"
default-environment = "default"
# `mixin add` errors if the name already exists; `|| true` makes re-runs
# idempotent. `update default` always follows to pull the latest mixin set.
cmd = "colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml 2>/dev/null || true && colcon mixin update default"

[tasks._install-hooks]
cmd = "pre-commit install"

[tasks.setup]
description = "One-shot workspace setup: vcs import, register colcon mixins, install git hooks"
default-environment = "default"
cmd = "echo 'Setup complete.'"
depends-on = ["_vcs-import", "_register-mixins", "_install-hooks"]

# ---- Lint ----

[tasks.lint]
description = "Run all pre-commit hooks across the workspace"
default-environment = "default"
cmd = "pre-commit run --all-files"

# ---- Build / test / clean ----

[tasks.build]
description = "Release colcon build"
default-environment = "default"
cmd = ["colcon", "build", "--mixin", "release"]
inputs = ["src"]

[tasks.test]
description = "Run colcon test and report results (fails the task if any test fails)"
default-environment = "ml"
cmd = "colcon test --packages-skip lerobot_robot_rosetta && colcon test-result --verbose"

[tasks.clean]
description = "Remove colcon build/install/log directories"
default-environment = "default"
cmd = "rm -rf build install log"

# ---- Run demos ----

[tasks.start-zenoh]
description = "Start the Zenoh RMW router (run in its own terminal, leave running)"
default-environment = "default"
cmd = ["ros2", "run", "rmw_zenoh_cpp", "rmw_zenohd"]

[tasks.so-arm-leader]
description = "Launch the leader-arm teleoperation node"
default-environment = "default"
cmd = ["ros2", "launch", "pai_leader_teleop", "leader_bringup.launch.py"]

[tasks.so-arm-real]
description = "Launch SO-ARM on real hardware"
default-environment = "default"
cmd = ["ros2", "launch", "pai_bringup", "so_arm_real_bringup.launch.py"]

[tasks.so-arm-gz]
description = "Launch SO-ARM in Gazebo"
default-environment = "default"
cmd = ["ros2", "launch", "pai_bringup", "so_arm_gz_bringup.launch.py"]

[tasks.so-arm-mujoco]
description = "Launch SO-ARM in MuJoCo"
default-environment = "default"
cmd = ["ros2", "launch", "pai_bringup", "so_arm_mujoco_bringup.launch.py"]

[tasks.rosetta-record-mujoco]
description = "Record episodes via Rosetta against the MuJoCo sim (requires the ml env for lerobot)"
default-environment = "ml"
cmd = [
  "ros2",
  "launch",
  "rosetta",
  "episode_recorder_launch.py",
  "contract_path:=$(ros2 pkg prefix pai_data_collection)/share/pai_data_collection/config/rosetta/so_arm101.yaml",
  "bag_base_dir:=datasets/so_arm101_mujoco/bags",
]

[tasks.test-joints]
description = "Publish a test trajectory to /forward_position_controller/commands"
default-environment = "default"
cmd = [
  "ros2",
  "topic",
  "pub",
  "/forward_position_controller/commands",
  "std_msgs/msg/Float64MultiArray",
  "{layout: {dim: [{label: joint, size: 6, stride: 1}]}, data: [0.2,-0.4,0,0,0,0.4]}",
  "--rate",
  "10",
]

[tasks.install-ml-deps]
description = "Auto-detect GPU and install the matching ML environment (ml or ml-blackwell)"
default-environment = "default"
cmd = "python3 scripts/install_ml_deps.py"

[tasks.verify-gpu]
description = "Print PyTorch + CUDA versions and detected GPU (requires the ml or ml-blackwell env)"
default-environment = "ml"
cmd = "python -c \"import torch; print(f'PyTorch: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'GPU: {torch.cuda.get_device_name(0)}' if torch.cuda.is_available() else 'No GPU detected')\""

[dependencies]
# Lint/Format
pre-commit = "*"

# Build deps
colcon-common-extensions = ">=0.3.0,<0.4"
colcon-mixin = ">=0.2.3,<0.3"
cmake = ">=3.30.5,<4"
ninja = ">=1.13.1,<2"
pkg-config = "*"
vcstool = "*"
patchelf = "*"
rosdep = "*"
ffmpeg = "*"
# Pin <4.13 for lerobot 0.4.4 opencv-python-headless constraint
opencv = "<4.13"
# Required by feetech_ros2_driver
cpp-expected = ">=1.1.0,<2"
range-v3 = ">=0.12.0,<0.13"

# Common base deps
python = "3.12.*"
pip = "*"
numpy = ">=1.26.4,<3"
# Explicitly installing pillow through Conda (rather that letting pip pull it an as transitive dependency)
# to avoid related issue to: libtiff.so.6: undefined symbol: jpeg12_write_raw_data, version LIBJPEG_8.0.
pillow = "*"
# Pinned to <26 to satisfy lerobot packaging constraint (packaging>=24.2,<26.0)
packaging = ">=24.2,<26"

# ROS dependencies
ros-kilted-ros-core = "*"
ros-kilted-ament-cmake = "*"
# From pai_bringup
ros-kilted-controller-manager = "*"
ros-kilted-cv-bridge = "*"
ros-kilted-launch = "*"
ros-kilted-launch-ros = "*"
ros-kilted-rclpy = "*"
ros-kilted-robot-state-publisher = "*"
ros-kilted-ros-gz-bridge = "*"
ros-kilted-ros-gz-sim = "*"
# From pai_data_collection
ros-kilted-rosbag2 = ">=0.32.0,<0.33"
ros-kilted-rosbag2-py = "*"
ros-kilted-rosbag2-storage-mcap = ">=0.32.0,<0.33"
# Gazebo Sim (provides gz CLI and simulation engine)
# Using version 9 to match ROS Kilted compatibility
gz-sim9 = "*"
# Gazebo GUI (required for gz sim -g)
gz-gui9 = "*"
# Gazebo Rendering (required for ogre2 render engine plugin)
gz-rendering9 = "*"
ros-kilted-rviz2 = "*"
ros-kilted-sensor-msgs = "*"
ros-kilted-std-msgs = "*"
ros-kilted-xacro = "*"
# From so_arm100_description
ros-kilted-joint-state-broadcaster = "*"
ros-kilted-joint-trajectory-controller = "*"
ros-kilted-parallel-gripper-controller = "*"
ros-kilted-position-controllers = "*"
ros-kilted-hardware-interface = "*"
ros-kilted-transmission-interface = "*"
ros-kilted-ament-index-python = "*"
ros-kilted-nav2-common = "*"
ros-kilted-gz-ros2-control = "*"
# From so_arm100_moveit_config
ros-kilted-moveit-ros-move-group = "*"
ros-kilted-moveit-kinematics = "*"
ros-kilted-moveit-planners = "*"
ros-kilted-moveit-simple-controller-manager = "*"
ros-kilted-joint-state-publisher = "*"
ros-kilted-joint-state-publisher-gui = "*"
ros-kilted-tf2-ros = "*"
ros-kilted-moveit-ros-control-interface = "*"
ros-kilted-moveit-ros-visualization = "*"
ros-kilted-moveit-ros-warehouse = "*"
ros-kilted-moveit-setup-assistant = "*"
ros-kilted-rviz-common = "*"
ros-kilted-rviz-default-plugins = "*"
# From feetech_ros2_driver
ros-kilted-rclcpp = "*"
ros-kilted-pluginlib = "*"
# Zenoh middleware
ros-kilted-rmw-zenoh-cpp = "*"
# Camera driver
ros-kilted-usb-cam = "*"
ros-kilted-camera-calibration = ">=6.0.11,<7"

[pypi-dependencies]
# From source because conda-forge 0.1.2 is too old for sdformat15.
# TODO(francocipollone): switch to upstream once merged: https://github.com/gazebosim/gz-mujoco/pull/125
sdformat-mjcf = { git = "https://github.com/francocipollone/gz-mujoco.git", branch = "francocipollone/avoid_eulerseq_compiler", subdirectory = "sdformat_mjcf" }

# ---- ML feature (torch comes from cuda-standard or cuda-blackwell) ----
[feature.ml.pypi-dependencies]
huggingface-hub = "*"
# LeRobot 0.4.x imports scipy.fftpack.idct; SciPy 2.0 removed fftpack re-exports.
scipy = ">=1.11.0,<2"
lerobot = { version = "==0.4.4", extras = ["feetech", "async"] }

# ---- CUDA variants ----
[feature.cuda-standard.pypi-dependencies]
torch = "*"
torchvision = "*"
torchaudio = "*"

[feature.cuda-blackwell]
# x86_64-only: no cu130 or torchcodec aarch64 wheels
platforms = ["linux-64"]

[feature.cuda-blackwell.pypi-dependencies]
# sm_120 needs cu130 wheels; requires open kernel module + CUDA 13.0 driver (580.126.20+)
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.24.1", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu130" }
torchcodec = "==0.4.0"

[activation]
scripts = ["scripts/activate.sh"]

[activation.env]
# Ensures the linker knows where to look for conda managed packages
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
# CMake needs this to find ROS 2 packages installed by robostack
CMAKE_PREFIX_PATH = "${CONDA_PREFIX}"
# pkg-config needs this to find system-installed packages like libserial-dev
# Supports both x86_64 and aarch64 architectures
PKG_CONFIG_PATH = "/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH}"
# Gazebo rendering engine plugin path
GZ_RENDERING_ENGINE_PATH = "${CONDA_PREFIX}/lib/gz-rendering-9/engine-plugins"
ROS_DISTRO = "kilted"
# Force ROS 2 to use Zenoh middleware
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
# uv/PyPI: large wheels (e.g. torch) need a longer per-request timeout than the default 30s
UV_HTTP_TIMEOUT = "600"
# Without this, colcon ignores the workspace-local .colcon/defaults.yaml
COLCON_DEFAULTS_FILE = "${PIXI_PROJECT_ROOT}/.colcon/defaults.yaml"
