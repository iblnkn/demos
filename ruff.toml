indent-width = 4
line-length = 99
target-version = "py312"

[format]
quote-style = "single"

[lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
ignore = [
  # Match ament convention
  "D100",
  "D104",
  "D203",
  "D212",
]
select = [
  "E",
  "W",
  "F",
  "B",
  "D",
  "I",
  "C4",
  "A",
  "RET",
  "RUF",
  "PL",
  "PIE",
  "FLY",
]
unfixable = []

[lint.pydocstyle]
# No convention — explicit ignores above match the ament convention
# (ignore D212, enforce D213) without conflicting with ruff-format.

[lint.isort]
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2
